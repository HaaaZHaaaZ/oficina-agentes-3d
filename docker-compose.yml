services:
  office:
    build: .
    container_name: virtoffice
    environment:
      PORT: "9502"
      HOST: 0.0.0.0
      HERMES_AGENT_API: ${HERMES_AGENT_API:-}
      POLL_INTERVAL_SECONDS: "5"
      ENABLE_SSE: "true"
    networks: [shared]
    restart: unless-stopped
networks:
  shared:
    name: automation-stack_app-network
    external: true
