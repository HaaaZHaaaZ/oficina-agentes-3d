<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<title>Offivo — Living Office Floor Plan</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { 
  background: #0c0c14;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: #fff;
}
#canvas-container { 
  width: 100vw; 
  height: 100vh; 
  position: fixed;
  top: 0;
  left: 0;
}
#canvas-container::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.35) 100%);
  z-index: 5;
}

/* UI Overlay */
#ui {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 10;
}

/* Header */
.header {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  padding: 18px 0;
  text-align: center;
  z-index: 100;
}
.title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-bottom: 14px;
}
.user-bar {
  display: flex;
  gap: 14px;
  background: rgba(15, 15, 22, 0.9);
  backdrop-filter: blur(16px);
  padding: 12px 22px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.1);
  pointer-events: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.user-avatar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: transform 150ms ease;
}
.user-avatar:hover, .user-avatar.active { transform: translateY(-3px); }
.user-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 200ms ease;
  position: relative;
}
.user-avatar.active .user-circle { transform: scale(1.1); border-color: rgba(255,255,255,0.5); }
.user-status-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid transparent;
}
.user-name {
  font-size: 9px;
  font-weight: 700;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* Right notification */
.notification {
  position: fixed;
  top: 22px;
  right: 22px;
  background: rgba(15, 15, 22, 0.92);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 14px 18px;
  pointer-events: auto;
  min-width: 230px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.notif-title {
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.notif-pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ef4444;
  animation: pulse 1.5s ease-in-out infinite;
}
.notif-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}
.standup-btn {
  position: fixed;
  top: 22px;
  right: 280px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 14px 20px;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  pointer-events: auto;
  transition: all 150ms ease;
}
.standup-btn:hover { background: rgba(255,255,255,0.14); }

/* Sidebars */
.left-sidebar {
  position: fixed;
  left: 22px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 100;
}
.sidebar-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: rgba(15, 15, 22, 0.9);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: rgba(255,255,255,0.55);
  pointer-events: auto;
  cursor: pointer;
  transition: all 150ms ease;
}
.sidebar-icon:hover, .sidebar-icon.active { background: rgba(30,30,45,0.95); color: #fff; }

.right-sidebar {
  position: fixed;
  right: 24px;
  top: 50%;
  transform: translateY(-50%) rotate(90deg);
  transform-origin: center right;
  display: flex;
  gap: 36px;
  z-index: 100;
}
.right-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  cursor: pointer;
  pointer-events: auto;
  transition: color 150ms ease;
  white-space: nowrap;
}
.right-label:hover { color: rgba(255,255,255,0.9); }

/* Bottom status bar */
.status-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(10, 10, 14, 0.94);
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 14px 28px;
  display: flex;
  justify-content: center;
  gap: 42px;
  z-index: 100;
  pointer-events: auto;
}
.status-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  transition: color 200ms ease;
}
.status-item.active { color: #fff; }
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.chat-btn {
  position: fixed;
  bottom: 12px;
  right: 22px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 12px 18px;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  cursor: pointer;
  pointer-events: auto;
  z-index: 101;
  transition: all 150ms ease;
}
.chat-btn:hover { background: rgba(255,255,255,0.18); }

/* Agent detail panel */
#detail-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.95);
  background: rgba(15, 15, 22, 0.96);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 28px;
  min-width: 360px;
  max-width: 420px;
  pointer-events: auto;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: all 200ms ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#detail-panel.open {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}
.detail-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.detail-avatar {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  background: rgba(255,255,255,0.05);
}
.detail-title {
  flex: 1;
}
.detail-name {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.detail-role {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.5);
}
.detail-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  font-size: 18px;
  cursor: pointer;
  transition: all 150ms ease;
}
.detail-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
.detail-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  margin-bottom: 20px;
}
.detail-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
.detail-status-text {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.detail-stat {
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}
.detail-stat-value {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}
.detail-stat-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.4);
}
.detail-section {
  margin-bottom: 16px;
}
.detail-section-title {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.4);
  margin-bottom: 10px;
}
.detail-task-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.detail-task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
}
.detail-task::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

/* Controls */
.controls {
  position: fixed;
  bottom: 90px;
  right: 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  pointer-events: auto;
}
.ctrl-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: rgba(15, 15, 22, 0.92);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: all 150ms ease;
}
.ctrl-btn:hover { background: rgba(35, 35, 50, 0.95); }
.ctrl-btn.active { background: rgba(59, 130, 246, 0.3); }

/* Toast */
#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15, 15, 22, 0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  pointer-events: none;
  opacity: 0;
  transition: all 200ms ease;
  z-index: 150;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.85); }
}

#loading {
  position: fixed;
  inset: 0;
  background: #0c0c14;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  transition: opacity 300ms ease;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #8B5CF6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.loading-text {
  margin-top: 16px;
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --- Paneles añadidos (prueba con Hermes y Claude) --- */
#vpanel { position: fixed; left: 86px; top: 50%; transform: translateY(-50%) translateX(-12px); width: min(420px, calc(100vw - 110px));
  max-height: 78vh; overflow: auto; background: rgba(18,18,30,0.94); color: #e8e8f0; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 18px 18px 14px; z-index: 60; opacity: 0; pointer-events: none; transition: .2s; font-size: 13.5px;
  backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
#vpanel.open { opacity: 1; pointer-events: auto; transform: translateY(-50%); }
#vpanel h3 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
#vpanel h4 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9a9ab0; }
#vpanel .x { background: none; border: 0; color: #9a9ab0; font-size: 18px; cursor: pointer; }
#vpanel .row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
#vpanel .row span:last-child { color: #b8b8cc; text-align: right; }
#vpanel .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; background: rgba(255,255,255,.08); }
#vpanel .ok { color: #34d399 } #vpanel .warn { color: #fbbf24 } #vpanel .bad { color: #f87171 }
#vpanel .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 4px; }
#vpanel .bar i { display: block; height: 100%; background: #8B5CF6; }
#vpanel .muted { color: #8a8aa0; font-size: 12px; }
#vpanel label.opt { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; cursor: pointer; }
#lockscreen { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; background: rgba(8,8,14,.82);
  backdrop-filter: blur(18px); color: #e8e8f0; text-align: center; }
#lockscreen.on { display: grid; }
#lockscreen button { margin-top: 14px; padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.08); color: #fff; cursor: pointer; font-size: 14px; }

/* La ficha del agente va a la derecha para no tapar al agente enfocado */
#detail-panel { left: auto !important; right: 24px; transform: translateY(-50%) translateX(16px) !important; max-height: 80vh; overflow: auto; }
#detail-panel.open { transform: translateY(-50%) !important; }
#focusBar { position: fixed; top: 140px; left: 50%; transform: translateX(-50%); z-index: 70; display: none; gap: 8px; align-items: center;
  background: rgba(18,18,30,0.9); color: #e8e8f0; border: 1px solid rgba(255,255,255,0.12); border-radius: 99px; padding: 6px 8px 6px 14px; font-size: 13px; }
#focusBar.on { display: flex; }
#focusBar button { border: 0; border-radius: 99px; padding: 6px 12px; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; font-size: 13px; }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Assembling Office</div>
</div>

<div id="canvas-container"></div>

<div id="ui">
  <div class="header">
    <div class="title">Hermes Headquarters</div>
    <div class="user-bar" id="userBar"></div>
  </div>

  <div class="notification">
    <div class="notif-title"><span class="notif-pulse"></span> Gathering in meeting room...</div>
    <div class="notif-sub" id="meetingSub">4/5 attending — Daily standup</div>
  </div>
  <button class="standup-btn" title="Estado del equipo">Equipo</button>

  <div class="left-sidebar">
    <div class="sidebar-icon active" data-view="office" title="Oficina">🏢</div>
    <div class="sidebar-icon" data-view="tasks" title="Tareas">📋</div>
    <div class="sidebar-icon" data-view="metrics" title="Servidor">📊</div>
    <div class="sidebar-icon" data-view="settings" title="Ajustes">⚙️</div>
    <div class="sidebar-icon" data-view="lock" title="Bloquear">🔒</div>
  </div>

  <div class="right-sidebar">
    <div class="right-label" data-open="metrics">Servidor</div>
    <div class="right-label" data-open="tasks">Tareas</div>
    <div class="right-label" data-open="activity">Actividad</div>
  </div>

  <div class="status-footer" id="statusFooter"></div>
  <button class="chat-btn" title="Actividad reciente">Actividad</button>

  <div class="controls">
    <button class="ctrl-btn" id="zoomIn">+</button>
    <button class="ctrl-btn" id="zoomOut">−</button>
    <button class="ctrl-btn" id="rotateBtn">↻</button>
    <button class="ctrl-btn active" id="labelsBtn" title="Toggle labels">🏷</button>
  </div>

  <div id="focusBar"><span id="focusName"></span><button id="focusInfo">Ficha</button><button id="focusExit">🏢 Vista general</button></div>
  <div id="vpanel" role="dialog" aria-live="polite"></div>
  <div id="lockscreen"><div><div style="font-size:42px">🔒</div><div style="font-size:18px;font-weight:700;margin-top:8px">Panel bloqueado</div>
    <div class="muted" style="opacity:.7">La información queda oculta hasta que lo desbloquees.</div>
    <button id="unlockBtn">Desbloquear</button></div></div>

  <div id="detail-panel">
    <div class="detail-header">
      <div class="detail-avatar" id="detailAvatar"></div>
      <div class="detail-title">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-role" id="detailRole"></div>
      </div>
      <button class="detail-close" id="detailClose">✕</button>
    </div>
    <div class="detail-status" id="detailStatus">
      <span class="detail-status-dot" id="detailStatusDot"></span>
      <span class="detail-status-text" id="detailStatusText">Working on research</span>
    </div>
    
    <div class="detail-grid">
      <div class="detail-stat">
        <div class="detail-stat-value" id="statTasks">12</div>
        <div class="detail-stat-label">Tasks Done</div>
      </div>
      <div class="detail-stat">
        <div class="detail-stat-value" id="statActive">3</div>
        <div class="detail-stat-label">Active</div>
      </div>
      <div class="detail-stat">
        <div class="detail-stat-value" id="statHours">4.2h</div>
        <div class="detail-stat-label">Today</div>
      </div>
    </div>
    
    <div class="detail-section">
      <div class="detail-section-title">Current Tasks</div>
      <div class="detail-task-list" id="detailTasks"></div>
    </div>
    
    <div class="detail-section">
      <div class="detail-section-title">Recent Output</div>
      <div class="detail-task-list" id="detailOutput"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const AGENTS = (window.__HERMES_AGENTS__ && window.__HERMES_AGENTS__.length)
  ? window.__HERMES_AGENTS__
  : [
  { id: 'orchestrator', name: 'Orchestrator', color: '#8B5CF6', role: 'Supervisor', emoji: '🧠', home: 'meeting', tasks: ['Reviewing pipeline', 'Coordinating agents', 'Approving handoffs'], output: ['Daily brief issued', 'Pipeline updated'] },
  { id: 'analyst', name: 'Analyst', color: '#3B82F6', role: 'Research', emoji: '📊', home: 'left', tasks: ['Market research', 'Data synthesis', 'Trend analysis'], output: ['Competitor report', 'Keyword research'] },
  { id: 'writer', name: 'Writer', color: '#EC4899', role: 'Content', emoji: '✍️', home: 'center', tasks: ['Drafting article', 'Editing copy', 'SEO optimization'], output: ['Blog post v2', 'Thread draft'] },
  { id: 'marketer', name: 'Marketer', color: '#F59E0B', role: 'Growth', emoji: '📢', home: 'right', tasks: ['Campaign planning', 'Audience targeting', 'Post scheduling'], output: ['Launch plan', 'Campaign brief'] },
  { id: 'coder', name: 'Coder', color: '#10B981', role: 'Dev', emoji: '💻', home: 'right2', tasks: ['Feature build', 'Code review', 'Deploy checks'], output: ['API endpoint', 'Bug fix merged'] }
];

const STATUS_LABELS = {
  working: 'working',
  idle: 'idle',
  meeting: 'meeting',
  away: 'away',
  walking: 'walking'
};

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

const agentStates = {};
const agentStats = {};
const recentChats = [];

function resetAgentStates(agentList) {
  agentList.forEach(a => {
    if (!agentStates[a.id]) {
      agentStates[a.id] = { status: a.status || 'idle', task: a.task || 'Idle', targetX: 0, targetZ: 0, currentX: 0, currentZ: 0 };
    }
    agentStates[a.id].status = a.status || agentStates[a.id].status;
    agentStates[a.id].task = a.task || agentStates[a.id].task;
    if (a.stats) agentStats[a.id] = a.stats;
  });
}

AGENTS.forEach(a => {
  agentStates[a.id] = { status: a.status || 'idle', task: a.task || 'Idle', targetX: 0, targetZ: 0, currentX: 0, currentZ: 0 };
  agentStats[a.id] = a.stats || { tasksDone: Math.floor(Math.random() * 30) + 8, active: Math.floor(Math.random() * 5) + 1, hours: (Math.random() * 6 + 1).toFixed(1) };
});

const ROOM_WIDTH = 38;
const ROOM_DEPTH = 26;
const WALL_HEIGHT = 3.2;

let scene, camera, renderer, raycaster, mouse;
let agents = [], labels = [], clickableObjects = [], bubbles = [], particles = [];
let zoom = 1, autoRotate = false, labelsVisible = true;
let currentRotation = -Math.PI / 4, targetRotation = -Math.PI / 4;
let clock, selectedAgent = null;
let lastMeetingUpdate = 0;
let liveConfig = { mode: 'demo', enable_sse: true };

let liveIds = '';
function applyLiveAgents(newAgents) {
  // Live data replaces the demo cast (they used to be appended to it).
  const ids = newAgents.map(a => a.id).sort().join(',');
  for (let i = AGENTS.length - 1; i >= 0; i--) {
    if (!newAgents.some(na => na.id === AGENTS[i].id)) { delete agentStates[AGENTS[i].id]; AGENTS.splice(i, 1); }
  }
  newAgents.forEach(na => {
    const existing = AGENTS.find(a => a.id === na.id);
    if (existing) {
      Object.assign(existing, na);
    } else {
      AGENTS.push(na);
    }
    const state = agentStates[na.id];
    if (state) {
      state.status = na.status || state.status;
      state.task = na.task || state.task;
    } else {
      agentStates[na.id] = { status: na.status || 'idle', task: na.task || 'Idle', targetX: 0, targetZ: 0, currentX: 0, currentZ: 0 };
    }
    if (na.stats) agentStats[na.id] = na.stats;
  });
  liveConfig.mode = 'live';
  // Rebuilding every 5 s snapped everyone back home: only rebuild when agents come or go.
  if (ids !== liveIds) {
    liveIds = ids;
    createAgents();
    setupUI();
    showToast('Live agents synced');
  }
  updateStatusBar();
  if (selectedAgent) selectAgent(selectedAgent.id);
}

async function fetchAgents() {
  try {
    const res = await fetch('/api/agents', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data) && data.length) applyLiveAgents(data);
  } catch (e) { console.log('Agent fetch failed:', e); }
}

async function fetchConfig() {
  try {
    const res = await fetch('/api/config', { cache: 'no-store' });
    if (res.ok) liveConfig = await res.json();
  } catch (e) {}
}

function startLiveUpdates() {
  fetchConfig();
  fetchAgents();
  setInterval(fetchAgents, 5000);

  if (liveConfig.enable_sse) {
    const es = new EventSource('/events');
    es.onmessage = ev => {
      try {
        const data = JSON.parse(ev.data);
        if (data.agents) applyLiveAgents(data.agents);
      } catch (e) {}
    };
    es.onerror = () => { /* falls back to polling */ };
  }
}

function hideLoading() {
  const loading = document.getElementById('loading');
  if (loading) loading.classList.add('hidden');
}

function init() {
  try {
    clock = new THREE.Clock();
    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0c14);
    scene.fog = new THREE.Fog(0x0c0c14, 45, 80);
    
    camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
    updateCamera();
    
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    
    setupLighting();
    createRoom();
    createFurniture();
    createAgents();
    setupUI();
    updateStatusBar();
    
    // Controls
    document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.max(0.5, zoom - 0.12); updateCamera(); });
    document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.min(2.2, zoom + 0.12); updateCamera(); });
    document.getElementById('rotateBtn').addEventListener('click', () => { 
      autoRotate = !autoRotate; 
      document.getElementById('rotateBtn').classList.toggle('active', autoRotate);
    });
    document.getElementById('labelsBtn').addEventListener('click', () => {
      labelsVisible = !labelsVisible;
      document.getElementById('labelsBtn').classList.toggle('active', labelsVisible);
      labels.forEach(l => l.visible = labelsVisible);
    });
    document.getElementById('detailClose').addEventListener('click', () => closeDetail());
    document.getElementById('userBar').addEventListener('click', (e) => {
      const avatar = e.target.closest('.user-avatar');
      if (avatar) selectAgent(avatar.dataset.agent);
    });
    document.getElementById('canvas-container').addEventListener('click', onCanvasClick);
    document.getElementById('canvas-container').addEventListener('mousemove', onMouseMove);
    
    // Sidebar clicks
    document.querySelectorAll('.sidebar-icon').forEach(icon => {
      icon.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-icon').forEach(i => i.classList.remove('active'));
        icon.classList.add('active');
        showToast(`Switched to ${icon.dataset.view} view`);
      });
    });
    
    window.addEventListener('resize', onWindowResize);
    
    setInterval(updateBehavior, 3500);
    setInterval(spawnRandomChat, 2500);
    updateBehavior();
    
    animate();
  } catch (err) {
    console.error('Office init error:', err);
    showToast('Office loaded with fallback mode');
  } finally {
    setTimeout(hideLoading, 600);
    startLiveUpdates();
  }
}

function updateCamera() {
  const distance = 48 * zoom;
  const height = 40 * zoom;
  camera.position.set(
    Math.sin(currentRotation) * distance,
    height,
    Math.cos(currentRotation) * distance
  );
  camera.lookAt(0, 0, 0);
}

  // Main sunlight

  sun.position.set(20, 35, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 4096;
  sun.shadow.mapSize.height = 4096;
  sun.shadow.camera.left = -30;
  sun.shadow.camera.right = 30;

function createWindow(x, y, z, rot) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.y = rot;
  
  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 1.8),
    new THREE.MeshBasicMaterial({ color: 0x87ceeb, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
  );
  group.add(glass);
  
  // Frame
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a3a45 });
  [[0, 0.9, 4, 0.08], [0, -0.9, 4, 0.08], [-2, 0, 0.08, 1.8], [2, 0, 0.08, 1.8], [0, 0, 0.06, 1.8]].forEach(([fx, fy, fw, fh]) => {
    const frame = new THREE.Mesh(new THREE.BoxGeometry(fw, fh, 0.08), frameMat);
    frame.position.set(fx, fy, 0);
    group.add(frame);
  });
  
  scene.add(group);
}

function createPoster(x, y, z, color, emoji) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 180;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 128, 180);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(8, 8, 112, 164);
  ctx.font = '60px serif';
  ctx.textAlign = 'center';
  ctx.fillText(emoji, 64, 100);
  
  const tex = new THREE.CanvasTexture(canvas);
  const poster = new THREE.Mesh(
    new THREE.PlaneGeometry(0.9, 1.2),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  poster.position.set(x, y, z);
  poster.rotation.y = x < 0 ? Math.PI/2 : -Math.PI/2;
  if (z > 0) poster.rotation.y = 0;
  scene.add(poster);
}

  const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.4, 6), glassMat);
  p1.position.set(roomX + 2.6, 1.2, roomZ);
  scene.add(p1);
  // Front glass wall, with a door next to the side wall.
  const p2 = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.4, 0.08), glassMat);
  p2.position.set(roomX - 1.1, 1.2, roomZ + 2.8);
  scene.add(p2);

  const rackGeo = new THREE.BoxGeometry(0.65, 1.8, 1);
  const rackMat = new THREE.MeshStandardMaterial({ color: 0x15151c, roughness: 0.3, metalness: 0.6 });
  
  for (let i = 0; i < 3; i++) {
    const rack = new THREE.Mesh(rackGeo, rackMat);
    rack.position.set(roomX - 1.2 + i * 0.9, 0.9, roomZ + 1.2);
    rack.castShadow = true;
    scene.add(rack);
    
    // Blinking LEDs
    for (let j = 0; j < 8; j++) {

        new THREE.BoxGeometry(0.5, 0.06, 0.02),
        new THREE.MeshBasicMaterial({ color: j % 3 === 0 ? 0x00ff88 : j % 3 === 1 ? 0x00ccff : 0xffaa00 })
      );

      led.userData = { blink: true, offset: i * 10 + j };
      scene.add(led);
    }
  }
}

  // Keyboard + mouse
  const kb = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.02, 0.22), new THREE.MeshStandardMaterial({ color: 0x2a2a30 }));
  kb.position.set(0, 0.91, 0.22);

  mouse.position.set(0.35, 0.91, 0.22);

    for (let i = 0; i < 6; i++) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.18 + Math.random() * 0.1, 8, 8), leafMat);

    cactus.position.y = 0.6;

    group.add(arm);

    for (let i = 0; i < 5; i++) {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8 + Math.random() * 0.3, 0.03), leafMat);

function getHomePosition(home) {
  switch(home) {
    case 'meeting': return { x: 0, z: -ROOM_DEPTH/2 + 6.5 };
    case 'left': return { x: -10.5, z: -2.5 };
    case 'center': return { x: -4, z: 1.5 };
    case 'right': return { x: 7, z: -0.5 };
    case 'right2': return { x: 10.5, z: 2 };
    default: return { x: 0, z: 0 };
  }
}

function createLabel(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = color;
  roundRect(ctx, 0, 0, canvas.width, canvas.height, 12);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
  sprite.scale.set(2.4, 0.6, 1);
  return sprite;
}

function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function selectAgent(agentId) {
  const agent = AGENTS.find(a => a.id === agentId);
  if (!agent) return;
  selectedAgent = agent;
  
  const panel = document.getElementById('detail-panel');
  const state = agentStates[agentId] || { status: agent.status || 'idle', task: agent.task || 'Idle' };
  const stats = agentStats[agentId] || { tasksDone: 0, active: 0, hours: 0 };
  
  document.getElementById('detailAvatar').textContent = agent.emoji;
  document.getElementById('detailAvatar').style.background = agent.color + '22';
  document.getElementById('detailName').textContent = agent.name;
  document.getElementById('detailRole').textContent = agent.role;
  document.getElementById('detailStatusDot').style.background = agent.color;
  document.getElementById('detailStatusDot').style.boxShadow = `0 0 12px ${agent.color}`;
  document.getElementById('detailStatusText').textContent = state.task || state.status;
  document.getElementById('statTasks').textContent = stats.tasksDone || 0;
  document.getElementById('statActive').textContent = stats.active || 0;
  document.getElementById('statHours').textContent = (stats.hours || 0) + 'h';
  
  document.getElementById('detailTasks').innerHTML = (agent.tasks || []).map(t => `
    <div class="detail-task" style="color:${esc(agent.color)}">${esc(t)}</div>
  `).join('');
  document.getElementById('detailOutput').innerHTML = (agent.output || []).map(o => `
    <div class="detail-task">${esc(o)}</div>
  `).join('');
  
  panel.classList.add('open');
  
  // Highlight in user bar
  document.querySelectorAll('.user-avatar').forEach(el => {
    el.classList.toggle('active', el.dataset.agent === agentId);
  });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.user-avatar').forEach(el => el.classList.remove('active'));
  selectedAgent = null;
}

function onCanvasClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(clickableObjects);
  
  if (intersects.length > 0) {
    const agentId = intersects[0].object.userData.agentId;
    if (agentId) selectAgent(agentId);
  }
}

function onMouseMove(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(clickableObjects);
  document.body.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
}

    if (liveConfig.mode === 'live') {
      // Working: at the desk, shifting a little. Idle: wanders around the office.
      if (agent.status === 'working') {
        const home = getHomePosition(agent.home);
        state.targetX = home.x + (Math.random() - 0.5) * 0.8;
        state.targetZ = home.z + (Math.random() - 0.5) * 0.8;
      } else if (rand < 0.5) {
        state.targetX = (Math.random() - 0.5) * (ROOM_WIDTH - 8);
        state.targetZ = (Math.random() - 0.5) * (ROOM_DEPTH - 8);
      }
      state.status = agent.status || 'idle';
      state.task = agent.task || state.task;
      return;
    }
    
    if (rand < 0.35) {
      state.status = 'meeting';
      const angle = Math.random() * Math.PI * 2;
      state.targetX = Math.cos(angle) * 2;
      state.targetZ = -ROOM_DEPTH/2 + 6.5 + Math.sin(angle) * 2;
      state.task = ['In standup', 'Discussing roadmap', 'Sprint planning', 'Reviewing metrics'][Math.floor(Math.random() * 4)];
      meetingCount++;
    } else if (rand < 0.65) {
      state.status = 'working';
      const home = getHomePosition(agent.home);
      state.targetX = home.x + (Math.random() - 0.5) * 1.2;
      state.targetZ = home.z + (Math.random() - 0.5) * 1.2;
      state.task = agent.tasks.length
        ? agent.tasks[Math.floor(Math.random() * agent.tasks.length)]
        : 'Working';
    } else if (rand < 0.85) {
      state.status = 'walking';
      state.targetX = (Math.random() - 0.5) * (ROOM_WIDTH - 8);
      state.targetZ = (Math.random() - 0.5) * (ROOM_DEPTH - 8);
      state.task = ['Coffee run', 'Water cooler chat', 'Walking break', 'Changing desk'][Math.floor(Math.random() * 4)];
    } else {
      state.status = 'idle';
      state.task = 'Taking a break';
      const home = getHomePosition(agent.home);
      state.targetX = home.x;
      state.targetZ = home.z;
    }
  });
  
  // Update meeting notification
  if (liveConfig.mode !== 'live') document.getElementById('meetingSub').textContent = `${Math.max(meetingCount, 2)}/5 attending — Daily standup`;
  
  updateStatusBar();
}

function spawnRandomChat() {
  if (liveConfig.mode === 'live') {
    // Now and then, a working agent shows what it is really doing.
    const busy = agents.filter(a => a.agent.status === 'working' && !a.activeBubble);
    if (busy.length && Math.random() < 0.3) {
      const a = busy[Math.floor(Math.random() * busy.length)];
      showChatBubble(a, (a.agent.task || '').slice(0, 22));
    }
    return;
  }
  // Find agents close together; throttle so bubbles don't stack
  const chatMessages = ['Nice work!', 'LGTM', 'Can you review?', 'On it', 'Coffee?', 'Standup?', 'Synced'];
  const now = Date.now();
  
  for (let i = 0; i < agents.length; i++) {
    const a1 = agents[i];
    if (a1.lastBubble && now - a1.lastBubble < 4000) continue;
    
    for (let j = i + 1; j < agents.length; j++) {
      const a2 = agents[j];
      if (a2.lastBubble && now - a2.lastBubble < 4000) continue;
      
      const dist = a1.group.position.distanceTo(a2.group.position);
      
      if (liveConfig.mode === 'live') break;
      if (dist < 3.2 && Math.random() > 0.75) {
        const msg = chatMessages[Math.floor(Math.random() * chatMessages.length)];
        showChatBubble(a1, msg);
        a1.lastBubble = now;
        a2.lastBubble = now;
        break;
      }
    }
  }
}

function showChatBubble(agentObj, text) {
  // Remove existing bubble for this agent to avoid overlap
  if (agentObj.activeBubble) {
    scene.remove(agentObj.activeBubble.sprite);
    const idx = bubbles.indexOf(agentObj.activeBubble);
    if (idx > -1) bubbles.splice(idx, 1);
  }
  
  const canvas = document.createElement('canvas');
  canvas.width = 300;
  canvas.height = 80;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#1a1a2e';
  ctx.strokeStyle = agentObj.agent.color;
  ctx.lineWidth = 2;
  roundRect(ctx, 0, 0, 300, 70, 12);
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 150, 35);
  
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.scale.set(1.8, 0.5, 1);
  sprite.position.set(agentObj.group.position.x, agentObj.group.position.y + 2.6, agentObj.group.position.z);
  scene.add(sprite);
  
  const bubble = { sprite, time: 0, life: 2.2 };
  bubbles.push(bubble);
  agentObj.activeBubble = bubble;
}

function updateBubbles(delta) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.time += delta;
    b.sprite.position.y += delta * 0.4;
    b.sprite.material.opacity = Math.max(0, 1 - (b.time / b.life));
    
    if (b.time > b.life) {
      scene.remove(b.sprite);
      // Clear activeBubble reference if this was it
      agents.forEach(a => {
        if (a.activeBubble === b) a.activeBubble = null;
      });
      bubbles.splice(i, 1);
    }
  }
}

function createTypingParticles(agentObj) {
  if (Math.random() > 0.3) return;
  
  const p = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.04, 0.04),
    new THREE.MeshBasicMaterial({ color: agentObj.agent.color })
  );
  p.position.set(
    agentObj.group.position.x + (Math.random() - 0.5) * 0.5,
    agentObj.group.position.y + 1.2,
    agentObj.group.position.z + 0.4
  );
  scene.add(p);
  particles.push({ mesh: p, vy: 0.02 + Math.random() * 0.02, life: 1 });
}

function updateParticles(delta) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= delta;
    p.mesh.position.y += p.vy;
    p.mesh.position.x += Math.sin(Date.now() * 0.005 + i) * 0.005;
    p.mesh.rotation.x += delta;
    p.mesh.rotation.y += delta;
    p.mesh.material.opacity = p.life;
    p.mesh.material.transparent = true;
    
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

function animateAgents(delta) {
  const now = Date.now();
  
  agents.forEach(a => {
    const state = agentStates[a.agent.id];
    a.time += delta;
    
    const dx = state.targetX - a.group.position.x;
    const dz = state.targetZ - a.group.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    
    // Mood ring pulse — synced with agent mood
    const moodPulse = 0.3 + Math.sin(a.time * 2.5) * 0.2;
    a.ring.material.opacity = moodPulse;
    a.ring.material.color.set(a.agent.color);
    
    // Eye blink
    a.blinkTimer += delta;
    if (a.blinkTimer > 3 + Math.random() * 2) {
      a.blinkTimer = 0;
    }
    
    if (dist > 0.4) {
      // Walking — smooth with elbow and knee bend
      a.walkCycle += delta * 8;
      const speed = 2.0 * delta;
      a.group.position.x += (dx / dist) * speed;
      a.group.position.z += (dz / dist) * speed;
      
      // Smooth turn toward direction
      const targetAngle = Math.atan2(dx, dz);
      let angleDiff = targetAngle - a.group.rotation.y;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      a.group.rotation.y += angleDiff * 0.15;
      
      const swing = Math.sin(a.walkCycle) * 0.6;
      const swing2 = Math.sin(a.walkCycle + Math.PI) * 0.6;
      
      // Legs swing from hip (group rotation)
      a.leftLeg.rotation.x = swing;
      a.rightLeg.rotation.x = swing2;
      
      // Knee bend — bend on backswing
      a.leftLowerLeg.rotation.x = Math.max(0, -swing * 0.8);
      a.rightLowerLeg.rotation.x = Math.max(0, -swing2 * 0.8);
      
      // Arms swing from shoulder
      a.leftArm.rotation.x = swing2 * 0.5;
      a.rightArm.rotation.x = swing * 0.5;
      
      // Elbow bend slightly
      a.leftLowerArm.rotation.x = Math.max(0, swing2 * 0.3);
      a.rightLowerArm.rotation.x = Math.max(0, swing * 0.3);
      
      // Body bob
      a.group.position.y = Math.abs(Math.sin(a.walkCycle * 2)) * 0.08;
      
      // Slight body lean forward
      a.body.rotation.x = 0.08;
      a.shoulders.rotation.x = 0.06;
      
      // Only override status to walking if we're actually en route
      if (state.status !== 'meeting' && state.status !== 'working' && state.status !== 'idle') {
        state.status = 'walking';
      }
    } else {
      // Arrived
      if (state.status === 'walking') {
        state.status = 'idle';
        state.task = state.task || 'Idle';
      }
      
      // Smoothly relax walking poses
      a.group.position.y *= 0.9;
      a.leftLeg.rotation.x *= 0.85;
      a.rightLeg.rotation.x *= 0.85;
      a.leftLowerLeg.rotation.x *= 0.85;
      a.rightLowerLeg.rotation.x *= 0.85;
      a.body.rotation.x *= 0.9;
      a.shoulders.rotation.x *= 0.9;
      
      // Breathing idle
      const breath = Math.sin(a.time * 1.5) * 0.02;
      a.body.position.y = 0.87 + breath;
      a.shoulders.position.y = 1.12 + breath * 0.5;
      a.head.position.y = 1.42 + breath * 0.3;
      a.neck.position.y = 1.22 + breath * 0.2;
      a.hair.position.y = 1.58 + breath * 0.3;
      
      // Arms relax
      a.leftArm.position.y = 1.08;
      a.rightArm.position.y = 1.08;
      a.leftArm.rotation.x *= 0.9;
      a.rightArm.rotation.x *= 0.9;
      a.leftArm.rotation.z = Math.sin(a.time * 0.8) * 0.05;
      a.rightArm.rotation.z = -Math.sin(a.time * 0.8) * 0.05;
      a.leftLowerArm.rotation.x *= 0.9;
      a.rightLowerArm.rotation.x *= 0.9;
      
      // Legs settle
      a.leftLeg.position.y = 0.58;
      a.rightLeg.position.y = 0.58;
      a.leftLowerLeg.rotation.x *= 0.9;
      a.rightLowerLeg.rotation.x *= 0.9;
      
      if (state.status === 'working') {
        // Typing — hands move up and down, elbows bent
        const typeSpeed = a.agent.typing ? 10 : 6;
        a.leftArm.rotation.x = -0.7 + Math.sin(a.time * typeSpeed) * 0.08;
        a.rightArm.rotation.x = -0.7 + Math.sin(a.time * typeSpeed + 0.3) * 0.08;
        a.leftLowerArm.rotation.x = 0.6 + Math.sin(a.time * typeSpeed) * 0.05;
        a.rightLowerArm.rotation.x = 0.6 + Math.sin(a.time * typeSpeed + 0.3) * 0.05;
        a.leftArm.rotation.z = 0.15;
        a.rightArm.rotation.z = -0.15;
        // Lean forward slightly
        a.body.rotation.x = 0.12;
        a.shoulders.rotation.x = 0.1;
        a.head.rotation.x = 0.08;
        createTypingParticles(a);
      } else if (state.status === 'meeting') {
        // Meeting — gesturing
        a.rightArm.rotation.x = -0.3 + Math.sin(a.time * 1.5) * 0.2;
        a.rightLowerArm.rotation.x = 0.3 + Math.sin(a.time * 1.5 + 0.5) * 0.15;
        a.leftArm.rotation.x = -0.2;
        a.leftLowerArm.rotation.x = 0.3;
        a.head.rotation.y = Math.sin(a.time * 0.3) * 0.25;
      } else {
        // Idle — head looks around, occasional stretch
        a.head.rotation.y = Math.sin(a.time * 0.4) * 0.2;
        a.head.rotation.x = Math.sin(a.time * 0.3) * 0.05;
        
        // Occasional arm stretch
        if (Math.sin(a.time * 0.2) > 0.95) {
          a.rightArm.rotation.x = -0.5;
          a.rightLowerArm.rotation.x = 0.2;
        }
      }
    }
    
    a.label.position.set(a.group.position.x, a.group.position.y + 2.3, a.group.position.z);
    a.label.visible = labelsVisible;
  });
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateCamera();
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  
  if (autoRotate) targetRotation += 0.0008;
  currentRotation += (targetRotation - currentRotation) * 0.04;
  updateCamera();
  
  animateAgents(delta);
  updateBubbles(delta);
  updateParticles(delta);
  
  // Update meeting notification periodically
  if (Date.now() - lastMeetingUpdate > 5000) {
    const meetingCount = AGENTS.filter(a => agentStates[a.id].status === 'meeting').length;
    if (liveConfig.mode !== 'live') document.getElementById('meetingSub').textContent = `${Math.max(meetingCount, 1)}/5 attending — Daily standup`;
    updateStatusBar();
    lastMeetingUpdate = Date.now();
  }
  
  // Blink server LEDs
  scene.traverse(child => {
    if (child.userData.blink) {
      child.material.opacity = 0.5 + Math.sin(Date.now() * 0.005 + child.userData.offset) * 0.5;
    }
  });
  
  renderer.render(scene, camera);
}

const NAV = { cell: 0.35, w: 0, h: 0, grid: null, chairs: [], seats: {} };
(function () {
  const _createChair = createChair;
  createChair = function (x, z, rotation, color) {
    const g = _createChair(x, z, rotation, color);
    NAV.chairs.push({ x, z, rot: rotation, group: g });
    return g;
  };
  const _createFurniture = createFurniture;
  createFurniture = function () {
    const before = new Set(scene.children);
    _createFurniture();
    createZones();
    buildNavGrid(scene.children.filter((c) => !before.has(c)));
    buildSpots();
  };
})();

};

function createZones() {
  const glass = new THREE.MeshStandardMaterial({ color: 0x9fb4d8, transparent: true, opacity: 0.18, roughness: 0.1, metalness: 0.4 });
  const frame = new THREE.MeshStandardMaterial({ color: 0x3a3f55 });
  const H = 2.2;
  // Wall from (x1,z1) to (x2,z2), axis-aligned; doors are just gaps between segments.
  function wall(x1, z1, x2, z2) {
    WALLS.push([x1, z1, x2, z2]);
    const len = Math.hypot(x2 - x1, z2 - z1), horiz = Math.abs(z2 - z1) < 1e-6;
    const g = new THREE.Group();
    const pane = new THREE.Mesh(new THREE.BoxGeometry(horiz ? len : 0.08, H, horiz ? 0.08 : len), glass);
    pane.position.y = H / 2;
    const top = new THREE.Mesh(new THREE.BoxGeometry(horiz ? len : 0.12, 0.08, horiz ? 0.12 : len), frame);
    top.position.y = H;
    const base = new THREE.Mesh(new THREE.BoxGeometry(horiz ? len : 0.12, 0.12, horiz ? 0.12 : len), frame);
    base.position.y = 0.06;
    g.add(pane, top, base);
    g.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
    scene.add(g);
  }
  function floorLabel(text, x, z, color, rot = 0) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 96;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 54px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = color; ctx.globalAlpha = 0.85; ctx.fillText(text.toUpperCase(), 256, 50);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.75), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, 0.03, z);
    scene.add(m);
  }
  function tint(x1, z1, x2, z2, color) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(x2 - x1), Math.abs(z2 - z1)),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.07, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set((x1 + x2) / 2, 0.02, (z1 + z2) / 2);
    scene.add(m);
  }
  const W = ROOM_WIDTH / 2, D = ROOM_DEPTH / 2;

  // Sala de reuniones (fondo, centro): puerta en el frente.
  wall(-5.2, -D, -5.2, -1.6); wall(5.2, -D, 5.2, -1.6);
  wall(-5.2, -1.6, -0.9, -1.6); wall(0.9, -1.6, 5.2, -1.6);
  tint(-5.2, -D, 5.2, -1.6, AREAS.meeting.color);
  floorLabel(AREAS.meeting.name, 0, -2.3, AREAS.meeting.color);

  // Servidores (fondo, izquierda): ya tiene paredes de cristal; rótulo y suelo.
  tint(-W, -D, -11.9, -6.7, AREAS.server.color);
  floorLabel(AREAS.server.name, -15.4, -7.2, AREAS.server.color);

  // Biblioteca (izquierda, junto a la estantería): puerta en el lateral.
  wall(-W, 1, -13.5, 1); wall(-13.5, 1, -13.5, 3.2); wall(-13.5, 5.0, -13.5, 7.2);
  tint(-W, 1, -13.5, 7.2, AREAS.research.color);
  floorLabel(AREAS.research.name, -16, 1.6, AREAS.research.color);

  // Cocina (esquina delantera izquierda): puerta hacia la oficina.
  wall(-W, 7.2, -15.6, 7.2); wall(-13.8, 7.2, -11.8, 7.2); wall(-11.8, 7.2, -11.8, D);
  tint(-W, 7.2, -11.8, D, AREAS.rest.color);
  floorLabel('Cocina', -15.5, 7.8, AREAS.rest.color);

  // Áreas abiertas, solo rótulo en el suelo.
  floorLabel('Puesto de Claude', -10.5, -0.2, '#D97757');
  floorLabel('Puesto de Hermes', 7, 1.2, '#8B5CF6');
  tint(-4.5, 4.2, 10, 9, AREAS.project.color);
  floorLabel(AREAS.project.name, 3, 4.6, AREAS.project.color);
  floorLabel(AREAS.rest.name, 9.5, 11.6, AREAS.rest.color);
  floorLabel(AREAS.phone.name, 15.5, -5.2, AREAS.phone.color);
}

// Sitting spot on the chair closest to (x, z), facing (fx, fz).
function chairSeat(x, z, fx, fz) {
  let best = null, bd = 1e9;
  NAV.chairs.forEach((c) => { const d = Math.hypot(c.x - x, c.z - z); if (d < bd) { bd = d; best = c; } });
  return best && { x: best.x, z: best.z, face: Math.atan2(fx - best.x, fz - best.z), sit: true };
}
function buildSpots() {
  const D = ROOM_DEPTH / 2, W = ROOM_WIDTH / 2;
  const stand = (x, z, fx, fz) => ({ x, z, face: Math.atan2(fx - x, fz - z), sit: false });
  SPOTS.desk = { claude: chairSeat(-8.9, -2.5, -10.5, -2.5), hermes: chairSeat(7, -2.1, 7, -0.5) };
  // Project desks (open1..open3): chairs in front of each desk.
  SPOTS.project = [chairSeat(-2, 8.6, -2, 7), chairSeat(3, 7.6, 3, 6), chairSeat(8, 9.1, 8, 7.5)];
  // Meeting table: two chairs facing each other.
  SPOTS.meeting = [chairSeat(3, -6.5, 0, -6.5), chairSeat(-3, -6.5, 0, -6.5)];
  SPOTS.server = [stand(-15.2, -7.3, -15.2, -9), stand(-13.9, -7.3, -13.9, -9)];
  SPOTS.research = [stand(-15.9, 3.4, -W, 3.4), stand(-15.9, 4.8, -W, 4.8)];
  SPOTS.phone = [{ x: W - 3.5, z: -D + 10, face: 0, sit: false, enter: true }, { x: W - 3.5, z: -D + 14, face: 0, sit: false, enter: true }];
  SPOTS.rest = [
    { x: 8.6, z: 8.0, face: Math.atan2(6.7 - 8.6, 10.2 - 8.0), sit: true, sofa: true },
    { x: 10.2, z: 8.0, face: Math.atan2(6.7 - 10.2, 10.2 - 8.0), sit: true, sofa: true },
    stand(-16, 8.9, -16, 10), stand(-14.4, 8.9, -14.4, 10),            // cocina
    stand(-4.4, 10.5, -2, 10.5), stand(0.4, 10.5, -2, 10.5),            // ping-pong
    stand(-15.8, -4, -W, -4),                                           // agua
  ];
}

function toCell(x, z) {
  return [Math.floor((x + ROOM_WIDTH / 2) / NAV.cell), Math.floor((z + ROOM_DEPTH / 2) / NAV.cell)];
}
function toWorld(i, j) {
  return { x: (i + 0.5) * NAV.cell - ROOM_WIDTH / 2, z: (j + 0.5) * NAV.cell - ROOM_DEPTH / 2 };
}
function navFree(i, j) {
  return i >= 0 && j >= 0 && i < NAV.w && j < NAV.h && !NAV.grid[j * NAV.w + i];
}

function buildNavGrid(objects) {
  NAV.w = Math.ceil(ROOM_WIDTH / NAV.cell);
  NAV.h = Math.ceil(ROOM_DEPTH / NAV.cell);
  NAV.grid = new Uint8Array(NAV.w * NAV.h);
  const R = 0.32; // agent radius
  const margin = 1.1; // keep away from the walls
  for (let j = 0; j < NAV.h; j++) for (let i = 0; i < NAV.w; i++) {
    const p = toWorld(i, j);
    if (Math.abs(p.x) > ROOM_WIDTH / 2 - margin || Math.abs(p.z) > ROOM_DEPTH / 2 - margin) NAV.grid[j * NAV.w + i] = 1;
  }
  const box = new THREE.Box3();
  objects.forEach((o) => {
    box.setFromObject(o);
    if (box.isEmpty()) return;
    if (box.max.y < 0.12) return;               // rugs, floor markings
    if (box.min.y > 1.2) return;                // things on the walls / ceiling
    const area = (box.max.x - box.min.x) * (box.max.z - box.min.z);
    if (area > 120) return;                     // floor-sized meshes
    const [i0, j0] = toCell(box.min.x - R, box.min.z - R);
    const [i1, j1] = toCell(box.max.x + R, box.max.z + R);
    for (let j = Math.max(0, j0); j <= Math.min(NAV.h - 1, j1); j++)
      for (let i = Math.max(0, i0); i <= Math.min(NAV.w - 1, i1); i++) NAV.grid[j * NAV.w + i] = 1;
  });
  // Desk seats: the chair each workstation created, keyed by its home position.
  ['meeting', 'left', 'center', 'right', 'right2'].forEach((home) => {
    const h = getHomePosition(home);
    let best = null, bd = 1e9;
    NAV.chairs.forEach((c) => { const d = Math.hypot(c.x - h.x, c.z - h.z); if (d < bd && d < 2.5) { bd = d; best = c; } });
    if (best) NAV.seats[home] = { x: best.x, z: best.z, face: Math.atan2(h.x - best.x, h.z - best.z) };
  });
}

function crossesWall(a, b) {
  return WALLS.some(([x1, z1, x2, z2]) => {
    if (Math.abs(z2 - z1) < 1e-6) {
      if ((a.z - z1) * (b.z - z1) >= 0) return false;
      const x = a.x + (b.x - a.x) * (z1 - a.z) / (b.z - a.z);
      return x > Math.min(x1, x2) && x < Math.max(x1, x2);
    }
    if ((a.x - x1) * (b.x - x1) >= 0) return false;
    const z = a.z + (b.z - a.z) * (x1 - a.x) / (b.x - a.x);
    return z > Math.min(z1, z2) && z < Math.max(z1, z2);
  });
}

// Nearest free cell from which (x, z) can be reached in a straight line without crossing a wall.
function nearestFreeTo(x, z) {
  const [i, j] = toCell(x, z);
  for (let r = 0; r < 30; r++)
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++)
      if ((Math.abs(di) === r || Math.abs(dj) === r) && navFree(i + di, j + dj) && !crossesWall(toWorld(i + di, j + dj), { x, z })) return [i + di, j + dj];
  return nearestFree(i, j);
}

function nearestFree(i, j) {
  if (navFree(i, j)) return [i, j];
  for (let r = 1; r < 30; r++)
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++)
      if ((Math.abs(di) === r || Math.abs(dj) === r) && navFree(i + di, j + dj)) return [i + di, j + dj];
  return [i, j];
}

function lineFree(a, b) {
  const steps = Math.ceil(Math.hypot(b.x - a.x, b.z - a.z) / (NAV.cell * 0.5));
  for (let k = 1; k < steps; k++) {
    const [i, j] = toCell(a.x + (b.x - a.x) * k / steps, a.z + (b.z - a.z) * k / steps);
    if (!navFree(i, j)) return false;
  }
  return true;
}

// A* over the grid, 8 directions without cutting corners, then straightened.
function findPath(from, to, allowGoal) {
  if (!NAV.grid) return [to];
  const [si, sj] = nearestFreeTo(from.x, from.z);
  let [gi, gj] = toCell(to.x, to.z);
  const goalBlocked = !navFree(gi, gj);
  if (goalBlocked) [gi, gj] = nearestFreeTo(to.x, to.z);
  const W = NAV.w, start = sj * W + si, goal = gj * W + gi;
  const g = new Float32Array(W * NAV.h).fill(Infinity), came = new Int32Array(W * NAV.h).fill(-1);
  const closed = new Uint8Array(W * NAV.h);
  const open = [[0, start]]; g[start] = 0;
  const hf = (n) => Math.hypot((n % W) - gi, Math.floor(n / W) - gj);
  let found = false, guard = 0;
  while (open.length && guard++ < 60000) {
    let bi = 0; for (let k = 1; k < open.length; k++) if (open[k][0] < open[bi][0]) bi = k;
    const [, n] = open.splice(bi, 1)[0];
    if (closed[n]) continue;
    closed[n] = 1;
    if (n === goal) { found = true; break; }
    const ni = n % W, nj = Math.floor(n / W);
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const i = ni + di, j = nj + dj;
      if (!navFree(i, j)) continue;
      if (di && dj && (!navFree(ni + di, nj) || !navFree(ni, nj + dj))) continue;
      const m = j * W + i, cost = g[n] + (di && dj ? 1.414 : 1);
      if (cost < g[m]) { g[m] = cost; came[m] = n; open.push([cost + hf(m), m]); }
    }
  }
  if (!found) return [];
  const cells = [];
  for (let n = goal; n !== -1; n = came[n]) cells.unshift(toWorld(n % W, Math.floor(n / W)));
  const pts = [];
  let anchor = { x: from.x, z: from.z };
  for (let k = 1; k < cells.length; k++) {
    if (!lineFree(anchor, cells[k])) { pts.push(cells[k - 1]); anchor = cells[k - 1]; }
  }
  pts.push(cells[cells.length - 1]);
  if (allowGoal && goalBlocked) pts.push({ x: to.x, z: to.z }); // last step onto the chair
  return pts;
}

function navGoalFor(a) {
  const ag = a.agent, area = ag.status === 'working' ? (ag.area || 'desk') : 'rest';
  const idx = Math.max(0, AGENTS.findIndex((x) => x.id === ag.id));
  // Keep the current spot while the area does not change (rest: change now and then).
  if (a.navGoal && a.navArea === area && (area !== 'rest' || Math.random() < 0.85)) return a.navGoal;
  a.navArea = area;
  let spot;
  if (area === 'desk') spot = SPOTS.desk[ag.id] || SPOTS.project[idx % 3];
  else if (area === 'rest') spot = SPOTS.rest[Math.floor(Math.random() * SPOTS.rest.length)];
  else spot = (SPOTS[area] || SPOTS.project)[idx % (SPOTS[area] || SPOTS.project).length];
  if (!spot) return a.navGoal || { x: 0, z: 0 };
  return { x: spot.x, z: spot.z, seat: spot.sit ? spot : null, stand: spot.sit ? null : spot, enter: !!spot.enter };
}

(function () {
  // Agents used to spawn on top of their desk: start on a free spot next to it.
  const _createAgents = createAgents;
  createAgents = function () {
    _createAgents();
    if (!NAV.grid) return;
    agents.forEach((a) => {
      const [i, j] = nearestFree(...toCell(a.group.position.x, a.group.position.z));
      const p = toWorld(i, j);
      a.group.position.x = p.x; a.group.position.z = p.z;
      const s = agentStates[a.agent.id];
      if (s) { s.targetX = p.x; s.targetZ = p.z; }
      a.path = []; a.navGoal = null; a.seated = false;
    });
  };
  const _updateBehavior = updateBehavior;
  updateBehavior = function () {
    _updateBehavior();
    if (liveConfig.mode !== 'live' || !NAV.grid) return;
    agents.forEach((a) => {
      const goal = navGoalFor(a);
      const same = a.navGoal && Math.hypot(goal.x - a.navGoal.x, goal.z - a.navGoal.z) < 0.01;
      if (same && (a.path?.length || a.seated || a.arrived)) return;
      a.arrived = false;
      if (!same) a.seated = false;
      a.navGoal = goal;
      a.path = findPath(a.group.position, goal, !!(goal.seat || goal.enter));
    });
  };

  const _animateAgents = animateAgents;
  animateAgents = function (delta) {
    if (liveConfig.mode === 'live' && NAV.grid) {
      agents.forEach((a) => {
        const s = agentStates[a.agent.id];
        if (!s) return;
        if (a.seated) { s.targetX = a.group.position.x; s.targetZ = a.group.position.z; return; }
        if (a.path && a.path.length) {
          const wp = a.path[0];
          if (Math.hypot(wp.x - a.group.position.x, wp.z - a.group.position.z) < 0.42) a.path.shift();
        }
        const wp = a.path && a.path[0];
        if (wp) { s.targetX = wp.x; s.targetZ = wp.z; }
        else { s.targetX = a.group.position.x; s.targetZ = a.group.position.z; }
        if ((!a.path || !a.path.length) && a.navGoal && a.navGoal.seat && !a.seated
            && Math.hypot(a.navGoal.seat.x - a.group.position.x, a.navGoal.seat.z - a.group.position.z) < 1.2) {
          // Arrived at the chair: slide onto it and face the desk.
          const g = a.navGoal.seat;
          a.group.position.x += (g.x - a.group.position.x) * 0.25;
          a.group.position.z += (g.z - a.group.position.z) * 0.25;
          if (Math.hypot(g.x - a.group.position.x, g.z - a.group.position.z) < 0.03) a.seated = true;
        }
      });
    }
    _animateAgents(delta);
    agents.forEach((a) => {
      const st = agentStates[a.agent.id];
      if (st && liveConfig.mode === 'live') st.status = a.navArea === 'meeting' && a.seated ? 'meeting' : (a.agent.status || 'idle');
      if (!a.seated && a.navGoal && a.navGoal.stand && (!a.path || !a.path.length)) {
        a.arrived = true;
        let d = a.navGoal.stand.face - a.group.rotation.y;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        a.group.rotation.y += d * 0.15;
      }
      const legs = [[a.leftLeg, a.leftLowerLeg], [a.rightLeg, a.rightLowerLeg]];
      if (!a.seated || !a.navGoal || !a.navGoal.seat) {
        if (a.sitPose) { // stand up: lower legs and shoes back where createAgents put them
          legs.forEach(([, low]) => { low.position.set(0, -0.38, 0); });
          legs.forEach(([leg]) => { leg.children[2] && leg.children[2].position.set(0, -0.52, 0.04); leg.children[2] && (leg.children[2].rotation.x = 0); });
          a.sitPose = false;
        }
        return;
      }
      const g = a.navGoal.seat;
      a.group.position.set(g.x, g.sofa ? 0.02 : 0.11, g.z);
      a.sitPose = true;
      let d = g.face - a.group.rotation.y;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      a.group.rotation.y += d * 0.2;
      // Thighs forward on the seat (leg group rotated -90°: its local -z is world down),
      // shin hanging from the knee, shoe at its end.
      legs.forEach(([leg, low]) => {
        leg.rotation.x = -Math.PI / 2;
        low.rotation.x = Math.PI / 2;
        low.position.set(0, -0.30, -0.12);
        const shoe = leg.children[2];
        if (shoe) { shoe.position.set(0, -0.36, -0.27); shoe.rotation.x = Math.PI / 2; }
      });
      a.label.position.set(a.group.position.x, a.group.position.y + 2.1, a.group.position.z);
    });
  };
})();


/* --- Enfocar a un agente desde los iconos de arriba (añadido) --- */
let focusId = null;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camReady = false;
updateCamera = function () {
  let pos, look;
  const f = focusId && agents.find((a) => a.agent.id === focusId);
  if (f) {
    // Closer view of the agent, keeping the current rotation of the scene.
    const p = f.group.position, d = 11 * zoom, h = 8 * zoom;
    // With the card open on the right, aim to the right of the agent so it sits left of centre.
    const cardOpen = document.getElementById('detail-panel').classList.contains('open');
    const k = cardOpen ? 3.2 * zoom : 0, rx = Math.cos(currentRotation) * k, rz = -Math.sin(currentRotation) * k;
    look = new THREE.Vector3(p.x + rx, 1.1, p.z + rz);
    pos = new THREE.Vector3(p.x + rx + Math.sin(currentRotation) * d, h, p.z + rz + Math.cos(currentRotation) * d);
  } else {
    look = new THREE.Vector3(0, 0, 0);
    pos = new THREE.Vector3(Math.sin(currentRotation) * 48 * zoom, 40 * zoom, Math.cos(currentRotation) * 48 * zoom);
  }
  if (!camReady) { camPos.copy(pos); camLook.copy(look); camReady = true; }
  camPos.lerp(pos, 0.06);
  camLook.lerp(look, 0.06);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
};
(function () {
  const _select = selectAgent, _close = closeDetail;
  const bar = document.getElementById('focusBar');
  function setFocus(id) {
    focusId = id;
    const a = id && AGENTS.find((x) => x.id === id);
    bar.classList.toggle('on', !!a);
    if (a) document.getElementById('focusName').textContent = `${a.emoji} Siguiendo a ${a.name}`;
    document.querySelectorAll('.user-avatar').forEach((el) => el.classList.toggle('active', el.dataset.agent === id));
  }
  const unfocusAgent = window.unfocusAgent = function () { _close(); setFocus(null); };
  selectAgent = function (id) { _select(id); if (AGENTS.some((a) => a.id === id)) setFocus(id); };
  // Closing the card keeps following the agent.
  closeDetail = function () { _close(); if (focusId) setFocus(focusId); };
  // Second click on the same icon: back to the whole office.
  document.getElementById('userBar').addEventListener('click', (e) => {
    const av = e.target.closest('.user-avatar');
    if (av && focusId && av.dataset.agent === focusId) { e.stopImmediatePropagation(); unfocusAgent(); }
  }, true);
  document.getElementById('focusExit').addEventListener('click', () => unfocusAgent());
  document.getElementById('focusInfo').addEventListener('click', () => {
    const open = document.getElementById('detail-panel').classList.contains('open');
    if (open) closeDetail(); else if (focusId) _select(focusId);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && focusId) unfocusAgent(); });
  // The office icon in the left bar also goes back to the general view.
  document.querySelector('.sidebar-icon[data-view="office"]').addEventListener('click', () => { if (focusId) unfocusAgent(); });
})();

init();

/* --- Funciones de los botones (datos: /data.json, lo escribe virtoffice-feeder) --- */
(function () {
  let DATA = null, view = null;
  const $ = (q) => document.querySelector(q);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ST = { working: ['Trabajando', 'ok'], idle: ['Libre', 'muted'], offline: ['Desconectado', 'bad'], meeting: ['Reunión', 'warn'], walking: ['Paseando', 'muted'] };
  const st = (s) => { const [t, c] = ST[s] || [s, 'muted']; return `<span class="pill ${c}">${esc(t)}</span>`; };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const bar = (p) => `<div class="bar"><i style="width:${Math.min(p, 100)}%;background:${p > 90 ? '#f87171' : p > 70 ? '#fbbf24' : '#8B5CF6'}"></i></div>`;
  const head = (t) => `<h3>${t}<button class="x" data-close>✕</button></h3>`;
  const when = (iso) => { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString('es-ES', { weekday: 'short', hour: '2-digit', minute: '2-digit' }); };

  const views = {
    team() {
      const a = DATA?.agents || [];
      return head('👥 Equipo') + a.map((x) => `<div class="row"><span>${esc(x.emoji)} <b>${esc(x.name)}</b><br><span class="muted">${esc(x.role)}</span></span><span>${st(x.status)} <span class="pill">📍 ${esc((AREAS[x.status === 'working' ? (x.area || 'desk') : 'rest'] || {}).name || '')}</span><br><span class="muted">${esc(x.task)}</span></span></div>`).join('')
        + `<p class="muted">Actualizado ${esc(DATA?.updated || '—')}</p>`;
    },
    tasks() {
      const h = DATA?.hermes || {}, a = DATA?.agents || [];
      let html = head('📋 Tareas') + '<h4>Ahora mismo</h4>' + a.map((x) => `<div class="row"><span>${esc(x.emoji)} ${esc(x.name)}</span><span>${esc(x.task)}</span></div>`).join('');
      const k = h.kanban || [];
      html += '<h4>Kanban de Hermes</h4>' + (k.length ? k.map((t) => `<div class="row"><span>${esc(t.title)}</span><span class="pill">${esc(t.status)}</span></div>`).join('') : '<p class="muted">Sin tareas abiertas.</p>');
      const c = h.cron || [];
      html += '<h4>Tareas programadas (Hermes)</h4>' + (c.length ? c.map((j) => `<div class="row"><span>${esc(j.name)}<br><span class="muted">${esc(j.schedule || '')}</span></span><span>${j.enabled === false ? '<span class="pill warn">pausada</span>' : `<span class="pill ${j.last_status === 'ok' ? 'ok' : j.last_status ? 'bad' : ''}">${esc(j.last_status || '—')}</span>`}<br><span class="muted">próx. ${when(j.next_run_at)}</span></span></div>`).join('') : '<p class="muted">Ninguna.</p>');
      if (h.source === 'fallback') html += '<p class="muted">Leído de los ficheros de Hermes.</p>';
      return html;
    },
    metrics() {
      const m = DATA?.metrics || {};
      const cs = m.containers || [], up = cs.filter((c) => c.state === 'running').length;
      const unhealthy = cs.filter((c) => /unhealthy/.test(c.status));
      return head('📊 Servidor')
        + `<div class="row"><span>Carga (1/5/15 min)</span><span>${(m.load || []).join(' / ')} <span class="muted">· ${m.cpus || '?'} hilos</span></span></div>`
        + `<div>Memoria <span class="muted">${m.mem_used_mb} / ${m.mem_total_mb} MB</span>${bar(pct(m.mem_used_mb, m.mem_total_mb))}</div>`
        + `<div style="margin-top:8px">Swap <span class="muted">${m.swap_used_mb} / ${m.swap_total_mb} MB</span>${bar(pct(m.swap_used_mb, m.swap_total_mb))}</div>`
        + `<div style="margin-top:8px">Disco <span class="muted">${m.disk_used_gb} / ${m.disk_total_gb} GB</span>${bar(pct(m.disk_used_gb, m.disk_total_gb))}</div>`
        + `<div class="row"><span>Encendido</span><span>${m.uptime_h} h</span></div>`
        + `<h4>Contenedores · ${up}/${cs.length} en marcha${unhealthy.length ? ` · <span class="bad">${unhealthy.length} con fallos</span>` : ''}</h4>`
        + cs.map((c) => `<div class="row"><span>${esc(c.name)}</span><span class="${c.state === 'running' ? (/unhealthy/.test(c.status) ? 'bad' : 'ok') : 'muted'}">${esc(c.status)}</span></div>`).join('');
    },
    activity() {
      const e = DATA?.events || [];
      return head('💬 Actividad') + (e.length ? e.map((x) => `<div class="row"><span><span class="muted">${esc(x.t)}</span> <b>${esc(x.who)}</b></span><span>${st(x.status)} ${esc(x.task)}</span></div>`).join('') : '<p class="muted">Sin cambios desde que arrancó el panel.</p>');
    },
    settings() {
      const chk = (id, on, txt) => `<label class="opt">${txt}<input type="checkbox" id="${id}" ${on ? 'checked' : ''}></label>`;
      return head('⚙️ Ajustes')
        + chk('optLabels', labelsVisible, 'Nombres sobre los personajes')
        + chk('optRotate', autoRotate, 'Rotación automática de la cámara')
        + chk('optBubbles', window.__bubblesOn !== false, 'Bocadillos con la tarea')
        + `<label class="opt">Zoom<input type="range" id="optZoom" min="0.5" max="2.2" step="0.05" value="${zoom}"></label>`
        + '<p class="muted">Los cambios solo afectan a este navegador.</p>';
    },
  };

  function render() {
    const p = $('#vpanel');
    if (!view) { p.classList.remove('open'); return; }
    // Do not re-render settings while the user is using its controls.
    if (view === 'settings' && p.classList.contains('open') && p.dataset.view === 'settings') return;
    p.innerHTML = views[view]();
    p.dataset.view = view;
    p.classList.add('open');
  }
  function open(v) {
    view = view === v ? null : v;
    document.querySelectorAll('.sidebar-icon').forEach((i) => i.classList.toggle('active', i.dataset.view === (view || 'office')));
    $('#vpanel').dataset.view = '';
    render();
  }

  document.querySelectorAll('.sidebar-icon').forEach((i) => i.addEventListener('click', () => {
    const v = i.dataset.view;
    if (v === 'office') return open(null);
    if (v === 'lock') { $('#lockscreen').classList.add('on'); return; }
    open(v);
  }));
  document.querySelectorAll('[data-open]').forEach((i) => { i.style.cursor = 'pointer'; i.addEventListener('click', () => open(i.dataset.open)); });
  $('.standup-btn').addEventListener('click', () => open('team'));
  $('.chat-btn').addEventListener('click', () => open('activity'));
  $('#unlockBtn').addEventListener('click', () => $('#lockscreen').classList.remove('on'));
  $('#vpanel').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) open(null); });
  $('#vpanel').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'optLabels' && t.checked !== labelsVisible) document.getElementById('labelsBtn').click();
    if (t.id === 'optRotate' && t.checked !== autoRotate) document.getElementById('rotateBtn').click();
    if (t.id === 'optBubbles') window.__bubblesOn = t.checked;
    if (t.id === 'optZoom') { zoom = parseFloat(t.value); updateCamera(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { open(null); $('#lockscreen').classList.remove('on'); } });

  // Bocadillos desactivables desde Ajustes.
  const _show = showChatBubble;
  showChatBubble = function (a, t) { if (window.__bubblesOn === false) return; return _show(a, t); };

  async function poll() {
    try {
      const r = await fetch('/data.json', { cache: 'no-store' });
      if (r.ok) DATA = await r.json();
      const a = DATA?.agents || [];
      // The server drops unknown fields from /api/agents: take area/project from data.json.
      a.forEach((x) => { const ag = AGENTS.find((y) => y.id === x.id); if (ag) { ag.area = x.area; ag.project = x.project; } });
      const busy = a.filter((x) => x.status === 'working').length;
      $('.notif-title').innerHTML = `<span class="notif-pulse"></span> ${busy ? `${busy} ${busy === 1 ? 'agente trabajando' : 'agentes trabajando'}` : 'Todos libres'}`;
      $('#meetingSub').textContent = a.map((x) => `${x.name}: ${(ST[x.status] || [x.status])[0]}`).join(' · ');
      if (view && view !== 'settings') render();
    } catch (e) {}
  }
  poll(); setInterval(poll, 5000);
})();
</script>
